# ============================================================
# 自动构建与发布工作流
#
# 触发方式：
#   1. push 任意 tag（如 1.0.0 或 v1.0.0）
#      -> 自动构建 + 测试 + 创建 GitHub Release
#      -> Release 标题/附件统一使用 v<版本>（例如 v1.0.0）
#   2. 手动运行（workflow_dispatch），填写版本号
#      -> 自动构建 + 测试 + 创建/更新 GitHub Release
#
# 构建目标：
#   - Windows x64（MSI + zip）
#   - Windows arm64（MSI + zip）
# 说明：当前应用是 WinForms + AntdUI，仅支持 Windows。
# ============================================================
name: Build & Release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version，例如 1.0.0 或 v1.0.0'
        required: true
        default: '1.0.0'

# 创建 Release 需要写权限。
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            wix-arch: x64
            artifact: win-x64
          - rid: win-arm64
            wix-arch: arm64
            artifact: win-arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 安装 Python（用于生成 WiX 源）
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 解析版本号
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $raw = $env:GITHUB_REF_NAME
          } else {
            $raw = "${{ github.event.inputs.version }}"
          }

          if ([string]::IsNullOrWhiteSpace($raw)) {
            $raw = '0.0.0'
          }

          $release = if ($raw.StartsWith('v', [System.StringComparison]::OrdinalIgnoreCase)) { $raw } else { 'v' + $raw }
          $ver = $release.TrimStart('v')
          $parts = $ver.Split('.')
          while ($parts.Count -lt 4) {
            $parts += '0'
          }
          if ($parts.Count -gt 4) {
            $parts = $parts[0..3]
          }
          $msi = $parts -join '.'

          "release=$release" >> $env:GITHUB_OUTPUT
          "msi=$msi" >> $env:GITHUB_OUTPUT

      - name: 还原依赖
        run: dotnet restore RpCalculator.sln

      - name: 构建（Release）
        run: dotnet build RpCalculator.sln -c Release --no-restore

      - name: 运行单元测试
        run: dotnet test RpCalculator.sln -c Release --no-build --no-restore

      - name: 发布 WinForms 多文件目录（${{ matrix.rid }}，用于 MSI/zip）
        run: dotnet publish src/RpCalculator.App/RpCalculator.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=false -p:DebugType=embedded -o artifacts/app

      - name: 发布单文件 EXE（${{ matrix.rid }}）
        run: dotnet publish src/RpCalculator.App/RpCalculator.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:DebugType=embedded -o artifacts/exe

      - name: 整理单文件 EXE 产物名
        shell: pwsh
        run: |
          $release = "${{ steps.version.outputs.release }}"
          Copy-Item artifacts/exe/RpCalculator.App.exe "artifacts/RpCalculator-$release-${{ matrix.artifact }}.exe" -Force

      - name: 生成 WiX 安装包源
        run: python installer/generate_wix.py --publish-dir artifacts/app --out-wxs artifacts/installer.wxs --out-wxl artifacts/installer.wxl --version ${{ steps.version.outputs.msi }}

      - name: 还原 WiX 工具
        run: dotnet tool restore

      - name: 添加 WiX UI 扩展
        run: dotnet tool run wix extension add WixToolset.UI.wixext/4.0.4

      - name: 构建 MSI（${{ matrix.artifact }}）
        run: dotnet tool run wix build -b artifacts/app -b . -arch ${{ matrix.wix-arch }} -ext WixToolset.UI.wixext -o artifacts/RpCalculator-Setup-${{ matrix.artifact }}.msi artifacts/installer.wxs -loc artifacts/installer.wxl

      - name: 打包绿色版 zip
        shell: pwsh
        run: |
          $release = "${{ steps.version.outputs.release }}"
          Compress-Archive -Path artifacts/app/* -DestinationPath "artifacts/RpCalculator-$release-${{ matrix.artifact }}.zip" -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: RpCalculator-${{ matrix.artifact }}
          path: |
            artifacts/RpCalculator-Setup-${{ matrix.artifact }}.msi
            artifacts/RpCalculator-${{ steps.version.outputs.release }}-${{ matrix.artifact }}.zip
            artifacts/RpCalculator-${{ steps.version.outputs.release }}-${{ matrix.artifact }}.exe
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码（读取 CHANGELOG.md）
        uses: actions/checkout@v4

      - name: 解析 Release 信息
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW="${{ github.ref_name }}"
          else
            RAW="${{ github.event.inputs.version }}"
          fi

          if [ -z "$RAW" ]; then
            RAW="0.0.0"
          fi

          case "$RAW" in
            v*|V*) RELEASE="$RAW" ;;
            *) RELEASE="v$RAW" ;;
          esac

          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="$RAW"
          else
            TAG="$RELEASE"
          fi

          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 准备 Release Notes
        id: notes
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.release }}"
          # 提取 CHANGELOG.md 中 “## [vX.Y.Z]” 小节作为 Release Notes。
          awk -v tag="$TAG" 'index($0, "## [" tag "]") == 1 { insec=1; next } insec && /^## / { exit } insec { print }' CHANGELOG.md > release-notes.md

          if [ -s release-notes.md ]; then
            echo "Using changelog section for $TAG"
          else
            echo "No changelog section found for $TAG; will use generated notes."
            rm -f release-notes.md
          fi

      - name: 下载 x64 产物
        uses: actions/download-artifact@v4
        with:
          name: RpCalculator-win-x64
          path: release/win-x64

      - name: 下载 arm64 产物
        uses: actions/download-artifact@v4
        with:
          name: RpCalculator-win-arm64
          path: release/win-arm64

      - name: 创建/更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          RELEASE="${{ steps.version.outputs.release }}"

          # 收集所有 .msi / .zip / .exe
          mapfile -d '' files < <(find release -type f \( -name '*.msi' -o -name '*.zip' -o -name '*.exe' \) -print0)

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating..."
            if [ -f release-notes.md ]; then
              gh release edit "$TAG" --title "$RELEASE" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
            else
              gh release edit "$TAG" --title "$RELEASE" --repo "$GITHUB_REPOSITORY"
            fi
            if [ ${#files[@]} -gt 0 ]; then
              gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            fi
          else
            echo "Creating release $TAG ($RELEASE)..."
            if [ -f release-notes.md ]; then
              gh release create "$TAG" "${files[@]}" \
                --title "$RELEASE" \
                --notes-file release-notes.md \
                --target "$GITHUB_SHA" \
                --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$TAG" "${files[@]}" \
                --title "$RELEASE" \
                --generate-notes \
                --target "$GITHUB_SHA" \
                --repo "$GITHUB_REPOSITORY"
            fi
          fi
